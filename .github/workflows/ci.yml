name: conformance-and-integrity
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check.mjs
      - run: npm run privacy:scan
      - run: npm run privacy:scan:vectors
      - name: Rehearse hosted OIDC callback and MCP HTTP adapter on loopback
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: |
          npm --prefix interop/pairing-gateway ci --ignore-scripts --no-audit --no-fund
          npm --prefix interop/pairing-gateway test
      - name: Verify frozen Passport conformance vectors across implementations
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: |
          node interop/passport-conformance/generate.mjs > "$RUNNER_TEMP/passport-vectors.json"
          cmp interop/passport-conformance/vectors.json "$RUNNER_TEMP/passport-vectors.json"
          node interop/passport-conformance/authority-vectors.mjs > "$RUNNER_TEMP/passport-authority.json"
          cmp interop/passport-conformance/authority.json "$RUNNER_TEMP/passport-authority.json"
          python3 interop/passport-conformance/test_runner.py
          python3 -m venv "$RUNNER_TEMP/kya-passport-python"
          "$RUNNER_TEMP/kya-passport-python/bin/pip" install --disable-pip-version-check cryptography==50.0.2
          for corpus in vectors authority; do
            python3 interop/passport-conformance/run.py --vectors "interop/passport-conformance/$corpus.json" -- node interop/passport-conformance/reference.mjs
            python3 interop/passport-conformance/run.py --vectors "interop/passport-conformance/$corpus.json" -- "$RUNNER_TEMP/kya-passport-python/bin/python" interop/passport-conformance/python_candidate.py
          done
      - name: Run tests (no test may be skipped on CI)
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap test/*.test.mjs | tee "$RUNNER_TEMP/tap.txt"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap.txt"
          grep -qx '# todo 0' "$RUNNER_TEMP/tap.txt"
      - run: node scripts/vector-runner-mutations.mjs
      - run: node scripts/conformance-execution-mutations.mjs
      - run: node scripts/vector-output-mutations.mjs
      - run: node scripts/declaration-authority-mutations.mjs
      - run: node scripts/declaration-schemes-mutations.mjs
      - run: node scripts/declaration-list-mutations.mjs
      - run: node scripts/bridge-snapshot-mutations.mjs
      - run: node scripts/bridge-currency-mutations.mjs
      - run: node scripts/bridge-report-mutations.mjs
      - run: node scripts/vc-report-mutations.mjs
      - run: node scripts/capture-tool-mutations.mjs
      - run: node scripts/standing-policy-mutations.mjs
      - run: node scripts/vc-trust-mutations.mjs
      - run: node scripts/capture-binding-mutations.mjs
      - run: node scripts/mutation-check.mjs
      - run: node scripts/adr-index.mjs
      - run: node scripts/profile-registry.mjs --check
      - run: node scripts/pack.mjs
      - run: node scripts/verify-release.mjs
      - name: Verify reproducible package bytes
        shell: bash
        run: |
          cp dist/release-receipt.json dist/first-receipt.json
          node scripts/pack.mjs
          node --input-type=module -e 'import {readFileSync} from "node:fs";const a=JSON.parse(readFileSync("dist/first-receipt.json"));const b=JSON.parse(readFileSync("dist/release-receipt.json"));if(a.archiveSha256!==b.archiveSha256)throw Error("non-reproducible archive");'
