name: Reproducible failure
description: A command, test or document that fails or is wrong, with a sanitized input.
title: "Failure: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, personal records or raw private traces. Do not post security exploit details here; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The package version or git commit you ran.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of node --version. This project needs Node.js 22 or later.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized input
      description: The exact command and a minimal synthetic input that reproduces the failure.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
