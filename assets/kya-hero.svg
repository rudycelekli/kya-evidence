<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">KYA Evidence. Know your agent. Show your work.</title><desc id="desc">Experimental open infrastructure for exact systems, explicit scopes and inspectable evidence. Passport, signed receipts and relying-party policy lead to a contestable assessment.</desc><style>.bg{fill:#e9f2e9}.ink{fill:#173c32}.muted{fill:#4f6659}.line{stroke:#b4cbb9;stroke-width:1}.panel{fill:#f5f8ef;stroke:#96b5a1}.accent{fill:#256c4b}.dot{fill:#d8a23f}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.sans{font-family:Arial,Helvetica,sans-serif}.pulse{animation:pulse 5s ease-in-out infinite}.traveler{animation:travel 9s linear infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes travel{0%{transform:translateX(0);opacity:0}10%,80%{opacity:1}100%{transform:translateX(300px);opacity:0}}@media(prefers-reduced-motion:reduce){.pulse,.traveler{animation:none}.traveler{display:none}}@media(prefers-color-scheme:dark){.bg{fill:#173c32}.ink{fill:#edf5e6}.muted{fill:#bed0c2}.panel{fill:#214d3e;stroke:#648c71}.line{stroke:#426c52}.accent{fill:#a6d1a4}}</style><rect class="bg" width="1200" height="440" rx="12"/><path class="line" d="M40 70h1120M40 395h1120M765 70v325"/><text class="mono muted" x="42" y="43" font-size="13" letter-spacing="3">AN OPEN PROPOSAL FOR AGENT ASSURANCE</text><text class="mono muted" x="1158" y="43" font-size="13" text-anchor="end">v0.1 / ALPHA</text><text class="sans ink" x="38" y="164" font-size="91" font-weight="700" letter-spacing="-5">Know your</text><text class="sans ink" x="38" y="251" font-size="91" font-weight="700" letter-spacing="-5">agent.</text><text class="sans accent" x="41" y="316" font-size="36" font-weight="600">Show your work.</text><text class="sans muted" x="42" y="357" font-size="18">Exact system. Explicit scope. Evidence you can inspect.</text><g transform="translate(809 100)"><text class="mono muted" x="0" y="0" font-size="12" letter-spacing="1.5">THE ASSESSMENT RECORD</text><rect class="panel" x="0" y="22" width="345" height="201" rx="3"/><text class="mono ink" x="22" y="56" font-size="14">01 / PASSPORT</text><text class="mono muted" x="22" y="81" font-size="12">manifest + configuration + scope</text><path class="line" d="M22 99h300"/><text class="mono ink" x="22" y="125" font-size="14">02 / VERIFIED RECEIPTS</text><text class="mono muted" x="22" y="150" font-size="12">signature + freshness + trust anchor</text><path class="line" d="M22 168h300"/><text class="mono ink" x="22" y="194" font-size="14">03 / RELYING POLICY</text><circle class="dot pulse" cx="320" cy="51" r="5"/><path class="line" d="M0 247h345"/><circle class="accent traveler" cx="10" cy="247" r="4"/><text class="mono accent" x="0" y="281" font-size="15">EXPLAINABLE. CONTESTABLE. REVOCABLE.</text></g><text class="mono muted" x="42" y="420" font-size="12">KYA EVIDENCE</text><text class="mono muted" x="1158" y="420" text-anchor="end" font-size="12">LOCAL-FIRST · APACHE-2.0 · NO UNIVERSAL TRUST CLAIM</text></svg>
