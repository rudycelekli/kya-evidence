<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 236" role="img" aria-labelledby="title desc"><title id="title">From declaration to inspectable qualification</title><desc id="desc">Bind exact system, verify signed receipts, enforce relying-party policy and explain a scoped decision. Unknown checks stay in the denominator; critical failures block qualification.</desc><style>.bg{fill:#f3f6ed}.ink{fill:#173c32}.sub{fill:#4f6659}.edge{stroke:#a8bea9;fill:none;stroke-width:1.5}.packet{stroke:#256c4b;fill:none;stroke-width:3;stroke-dasharray:8 360;animation:flow 5s linear infinite}.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}@keyframes flow{to{stroke-dashoffset:-368}}@media(prefers-reduced-motion:reduce){.packet{animation:none;stroke-dasharray:none;opacity:.25}}@media(prefers-color-scheme:dark){.bg{fill:#173c32}.ink{fill:#edf5e6}.sub{fill:#bed0c2}.edge{stroke:#648c71}.packet{stroke:#a6d1a4}}</style><rect class="bg" width="1200" height="236" rx="5"/><path class="edge" d="M65 63h1060"/><path class="packet" d="M65 63h1060"/><g class="ink"><circle cx="65" cy="63" r="6"/><circle cx="355" cy="63" r="6"/><circle cx="645" cy="63" r="6"/><circle cx="935" cy="63" r="6"/></g><g class="mono sub" font-size="12"><text x="45" y="35">01 / BIND</text><text x="335" y="35">02 / VERIFY</text><text x="625" y="35">03 / GATE</text><text x="915" y="35">04 / EXPLAIN</text></g><g class="sans ink" font-size="23" font-weight="700"><text x="45" y="111">Exact subject</text><text x="335" y="111">Signed evidence</text><text x="625" y="111">Your trust policy</text><text x="915" y="111">A scoped decision</text></g><g class="sans sub" font-size="15"><text x="45" y="143">Harness, model, tools, config</text><text x="45" y="165">and permission scope.</text><text x="335" y="143">Allowed signer, expiry, suite</text><text x="335" y="165">and evaluator binding.</text><text x="625" y="143">Fixed denominator, critical gates,</text><text x="625" y="165">coverage and revocation.</text><text x="915" y="143">Every check, rejection and limit.</text><text x="915" y="165">Qualification is policy-specific.</text></g><text class="mono sub" x="45" y="210" font-size="12">DECLARED ≠ FIXTURE-TESTED ≠ RUNTIME-OBSERVED ≠ INDEPENDENTLY ASSESSED</text></svg>
